<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sauercrowd Stats - Offline</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent: #bb86fc;
            --border: #333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            text-align: center;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        h1 {
            margin: 0 0 15px 0;
            font-size: 1.8rem;
            background: linear-gradient(to right, #bb86fc, #03dac6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #666;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <span class="icon">🚧</span>

    <h1>Vorübergehend nicht verfügbar</h1>

    <p>
        Das Projekt ist momentan offline.
        <br><br>
        Bitte schaue zu einem späteren Zeitpunkt wieder vorbei.
    </p>

    <div class="footer">
        Fan Project. Not affiliated with Blizzard Entertainment or Sauercrowd.
    </div>
</div>

</body>
</html>
